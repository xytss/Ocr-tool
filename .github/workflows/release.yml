name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_INSTALL_DIR: '${{ github.workspace }}\.dotnet'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: 'global.json'

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+$')
          {
              throw ('发布标签格式无效：{0}' -f $tag)
          }

          $version = $tag.Substring(1)
          'RELEASE_VERSION={0}' -f $version |
              Out-File -FilePath $env:GITHUB_ENV -Encoding 'utf8' -Append

      - name: Run project tests
        shell: pwsh
        run: & '.\eng\dotnet.ps1' test '.\OcrTool.slnx' --configuration 'Release'

      - name: Run release script tests
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath '.\tests' -Filter '*.ps1' |
              Sort-Object -Property 'Name' |
              ForEach-Object { & $_.FullName }

      - name: Build Windows packages
        shell: pwsh
        run: & '.\eng\release-windows.ps1' -Version '${{ env.RELEASE_VERSION }}'

      - name: Build Linux API package
        shell: pwsh
        run: & '.\eng\release-api-linux.ps1' -Version '${{ env.RELEASE_VERSION }}'

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          $version = '${{ env.RELEASE_VERSION }}'
          $releaseRoot = Join-Path 'artifacts\release' $version
          $assets = @(
              (Join-Path $releaseRoot ('OcrTool-{0}-win-x64-portable.zip' -f $version)),
              (Join-Path $releaseRoot ('OcrTool-{0}-win-x64-setup.msi' -f $version)),
              (Join-Path $releaseRoot ('OcrTool-{0}-api-linux-x64.tar.gz' -f $version))
          )

          gh release create '${{ github.ref_name }}' $assets `
              --repo '${{ github.repository }}' `
              --verify-tag `
              --generate-notes `
              --title ('OCR 工具 {0}' -f $version)

          if ($LASTEXITCODE -ne 0)
          {
              throw 'GitHub Release 创建失败。'
          }
